; ─────────────────────────────────────────────────────────────────────────────
; Réglages PHP de production — Gestion Scolaire
; CRUCIAL : display_errors=Off évite que des warnings soient injectés dans la
; sortie binaire (sinon les PDF/Excel générés sont corrompus).
; ─────────────────────────────────────────────────────────────────────────────

display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Mémoire suffisante pour la génération PDF (DomPDF embarque les polices)
memory_limit = 256M
max_execution_time = 120

; Uploads (photos d'élèves)
upload_max_filesize = 10M
post_max_size = 12M

; Sécurité / divers
expose_php = Off
date.timezone = UTC

; OPcache (performances)
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
